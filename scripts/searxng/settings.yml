# SearXNG for Finance-Agent's web_search (src/benchmarks/finance_agent.py).
# Started by scripts/searxng/run.sh, which copies this file under
# data-claude/searxng/ with a fresh secret key and the local contact; neither is committed.
#
# Only engines whose operators allow automated queries are kept (checked 2026-11-04):
# Wikipedia (MediaWiki API) and Wikidata (query service), both of which ask for an
# identifying User-Agent with contact details and few requests in flight. The
# scraped web engines are dropped: Google, Bing and Brave disallow /search to bots
# in robots.txt, and DuckDuckGo offers no web-results API (and is blocked on the
# second Spark). Their sanctioned APIs are retired (Bing), closed to new customers
# (Google Custom Search) or paid (Brave Search API).
use_default_settings:
  engines:
    keep_only:
      - wikipedia
      - wikidata

general:
  instance_name: "agent-scaling-searxng"

server:
  secret_key: "set-by-run.sh"
  # Only this machine queries it (the port is bound to 127.0.0.1), so the
  # public-instance bot limiter has nothing to protect.
  limiter: false
  image_proxy: false

search:
  safe_search: 0
  # JSON is what the agent's tool reads; HTML is kept for a human to look.
  formats:
    - html
    - json

outgoing:
  request_timeout: 6.0
  # Wikimedia's User-Agent policy: name the client and give a contact (run.sh fills it in).
  useragent_suffix: "CONTACT_SET_BY_RUN_SH"
  # Wikimedia asks for at most 3 requests in flight per client.
  pool_connections: 3
  pool_maxsize: 3
